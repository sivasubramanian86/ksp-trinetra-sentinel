name: KSP Trinetra Sentinel CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Security & Secret Scan Job (Gitleaks)
  gitleaks-security-scan:
    name: 🛡️ Security & Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Node.js Gateway & MCP Tool Integration Tests
  node-gateway-tests:
    name: 🟢 Node.js API Gateway & MCP Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'functions/api_gateway/package-lock.json'

      - name: Install API Gateway Dependencies
        run: |
          cd functions/api_gateway
          npm ci || npm install

      - name: Run MCP & Gateway Test Suite
        run: |
          node functions/api_gateway/tests/test_mcp_tools.js

  # 3. Python ML Engine & Forensic Pytest
  python-ml-pytest:
    name: 🐍 Python ML Engine & Forensic Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python v3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/python-services/requirements.txt'

      - name: Install Python Dependencies
        run: |
          cd backend/python-services
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Forensic Triage Pytest Suite
        run: |
          cd backend/python-services
          python -m pytest tests/test_forensics.py -v

  # 4. Next.js Command Center Production Export Build
  nextjs-client-build:
    name: ⚛️ Next.js Command Center Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Build Production Static Export
        run: |
          npm run build --prefix client
